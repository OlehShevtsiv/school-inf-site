<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#16203a"/>
    </linearGradient>
    <linearGradient id="cube" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g stroke="#22d3ee" stroke-opacity="0.12" stroke-width="1">
    <path d="M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800"/>
    <path d="M100 0 V500 M200 0 V500 M300 0 V500 M400 0 V500 M500 0 V500 M600 0 V500 M700 0 V500"/>
  </g>
  <!-- ізометричний куб -->
  <g transform="translate(400 240)">
    <polygon points="0,-110 95,-55 95,55 0,110 -95,55 -95,-55" fill="none" stroke="url(#cube)" stroke-width="3"/>
    <polygon points="0,-110 95,-55 0,0 -95,-55" fill="#22d3ee" fill-opacity="0.25" stroke="#22d3ee" stroke-width="2"/>
    <polygon points="95,-55 95,55 0,110 0,0" fill="#a78bfa" fill-opacity="0.22" stroke="#a78bfa" stroke-width="2"/>
    <polygon points="-95,-55 0,0 0,110 -95,55" fill="#f472b6" fill-opacity="0.16" stroke="#f472b6" stroke-width="2"/>
    <circle cx="0" cy="-110" r="6" fill="#22d3ee"/>
    <circle cx="95" cy="-55" r="6" fill="#22d3ee"/>
    <circle cx="-95" cy="-55" r="6" fill="#22d3ee"/>
    <circle cx="0" cy="0" r="6" fill="#a78bfa"/>
    <circle cx="95" cy="55" r="6" fill="#a78bfa"/>
    <circle cx="-95" cy="55" r="6" fill="#f472b6"/>
    <circle cx="0" cy="110" r="6" fill="#f472b6"/>
  </g>
  <text x="400" y="445" fill="#97a3c4" font-size="22" text-anchor="middle">Тут буде фото 3D-моделі вашого учня (Blender / Tinkercad)</text>
</svg>
