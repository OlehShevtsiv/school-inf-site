<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#1a1430"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg2)"/>
  <!-- рамка 3D-принтера -->
  <g stroke="#a78bfa" stroke-width="4" fill="none">
    <rect x="240" y="90" width="320" height="300" rx="10"/>
    <line x1="240" y1="150" x2="560" y2="150"/>
  </g>
  <!-- екструдер -->
  <g>
    <rect x="370" y="135" width="60" height="40" rx="6" fill="#22d3ee" fill-opacity="0.85"/>
    <polygon points="392,175 408,175 400,195" fill="#f472b6"/>
  </g>
  <!-- надрукований шар -->
  <g fill="#34d399" fill-opacity="0.85">
    <rect x="330" y="330" width="140" height="14" rx="4"/>
    <rect x="345" y="312" width="110" height="14" rx="4"/>
    <rect x="360" y="294" width="80" height="14" rx="4"/>
  </g>
  <!-- платформа -->
  <rect x="280" y="348" width="240" height="10" rx="4" fill="#97a3c4"/>
  <!-- нитка філаменту -->
  <path d="M400 195 Q 400 240 400 290" stroke="#f472b6" stroke-width="3" stroke-dasharray="6 7" fill="none"/>
  <text x="400" y="445" fill="#97a3c4" font-size="22" text-anchor="middle">Тут буде фото виробу зі шкільного 3D-принтера</text>
</svg>
